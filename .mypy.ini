[mypy]
python_version = 3.8
show_error_codes = True
pretty = True
files = src/, tests/

ignore_missing_imports = False
no_implicit_optional = True
strict_equality = True
strict_optional = True
check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True

warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True

[mypy-tests.test_l10n]
disallow_untyped_defs = False

[mypy-tests.test_allocate]
# The pre-approved acceptance tests carry # type: ignore[arg-type] on
# sum(result) == money assertions.  mypy 1.9's typeshed gained a
# _SupportsSumWithNoDefaultGiven protocol that Money satisfies, so the
# ignores are technically unused.  Suppress the noise here rather than
# in the protected test file.
warn_unused_ignores = False

[mypy-babel.*]
ignore_missing_imports = True
